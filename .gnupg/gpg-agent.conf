default-cache-ttl 3600
max-cache-ttl 3600
enable-ssh-support
no-allow-external-cache
#disable-scdaemon
#pinentry-program /usr/local/bin/pinentry-mac
#pinentry-program /usr/sbin/pinentry-curses
#pinentry-program /opt/homebrew/bin/pinentry-mac
#pinentry-program /usr/bin/pinentry-curses
#pinentry-program /Users/haugenh1/.gnupg/pinentry-ide.sh
#pinentry-program /etc/profiles/per-user/hunner/bin/pinentry-gtk-2
#pinentry-program /etc/profiles/per-user/hunner/bin/pinentry-gnome3
# slice (macOS): pinentry_mac is in environment.systemPackages in
# hosts/slice/configuration.nix, so this path is stable across rebuilds.
# It is a wrapper that execs the binary inside pinentry-mac.app, which is
# also gnupg's compiled-in default on darwin, so this line is belt and
# braces rather than strictly required. A curses pinentry cannot work
# here: launchd starts the agent at login, with no terminal.
pinentry-program /run/current-system/sw/bin/pinentry-mac

# Restricted (extra) socket, relocated out of the 0700 $XDG_RUNTIME_DIR so the
# `agents` user can reach it and sign with this YubiKey. See
# ~/Documents/git/nix/hosts/liminal/modules/agents-gpg-bridge/.
#
# DO NOT uncomment by hand before /run/agents-gpg exists: gpg-agent refuses to
# start at all when the extra-socket directory is missing ("error binding
# socket ... No such file or directory", then exit 2), which would take out
# signing and ssh-agent together. Import that module, nixos-rebuild switch,
# then run its setup-agents-gpg.sh -- it checks for the directory and does the
# uncommenting for you.
#extra-socket /run/agents-gpg/S.gpg-agent.extra
#extra-socket /Users/hunner/.gnupg/S.gpg-agent.extra

# Left over from debugging on liminal. /home/hunner does not exist on
# macOS, so the agent silently falls back to stderr -- which launchd
# discards -- and `debug-level guru` turns on mpi/crypto/memory/cache/
# hashing/ipc tracing for every operation. Off here.
#log-file /home/hunner/.gnupg/agent.log
#debug-level guru
